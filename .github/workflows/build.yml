name: Build

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "*.md"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default "tools" package was removed from the SDK repo.
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Build plugin and plugin list
        working-directory: src
        env:
          # Ensure the generated plugins.json points at this repository.
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x gradlew
          ./gradlew make makePluginsJson --no-daemon --console=plain

      - name: Publish builds branch
        working-directory: src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          cd ..
          rm -rf builds
          git clone --quiet "$REPO_URL" builds
          cd builds

          if git rev-parse --verify --quiet origin/builds > /dev/null; then
            git checkout --quiet -B builds origin/builds
          else
            git checkout --quiet --orphan builds
          fi

          # Keep only the freshly built artifacts on this branch.
          git rm -rf . > /dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          cp ../src/*/build/*.cs3 .
          cp ../src/build/plugins.json .

          cat > repo.json <<EOF
          {
              "name": "TurkMS",
              "description": "TurkMS - TMDB-powered multi-source CloudStream plugin for Turkish movies and TV series.",
              "manifestVersion": 1,
              "pluginLists": [
                  "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/builds/plugins.json"
              ]
          }
          EOF

          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Build ${GITHUB_SHA}" || exit 0
          git push origin builds --force
